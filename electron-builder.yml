appId: com.thrustbook.desktop
productName: Thrustbook
copyright: Copyright © 2026 Thrustbook
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - package.json
  - "!**/*.map"
asar: true
# ONNX Runtime ships a native binding plus its shared library; both must live
# outside the asar archive to be loadable.
asarUnpack:
  - node_modules/onnxruntime-node/bin/**/*
extraResources:
  - THIRD_PARTY_NOTICES.md
  - THIRD_PARTY_LICENSES/**/*
  - LICENSE
win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  artifactName: Thrustbook-Setup-${version}-${arch}.${ext}
  files:
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/linux/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/arm64/**"
nsis:
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Thrustbook
  deleteAppDataOnUninstall: false
  differentialPackage: true
  runAfterFinish: true
linux:
  icon: build/icon.png
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  category: Science
  maintainer: Thrustbook <engineering@thrustbook.local>
  artifactName: Thrustbook-${version}-${arch}.${ext}
  files:
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/**"
mac:
  icon: build/icon.png
  target:
    - target: dmg
      arch: [x64, arm64]
  category: public.app-category.developer-tools
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  artifactName: Thrustbook-${version}-${arch}.${ext}
  files:
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/linux/**"
dmg:
  title: Thrustbook ${version}
publish:
  provider: github
  owner: DVVagram
  repo: Thrustbook
  releaseType: release
